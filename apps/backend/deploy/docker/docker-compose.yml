version: "3.8"

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=libsql://turso:8080
      - LOG_LEVEL=debug
      - LOG_FORMAT=console
    depends_on:
      turso:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  turso:
    image: tursodatabase/libsql-server:latest
    ports:
      - "8081:8080"
    volumes:
      - turso-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  turso-data:
