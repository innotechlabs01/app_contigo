name: CI

on:
  push:
    branches:
      - main
      - "*. branch"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  # Backend tests
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run tests
        run: |
          go test ./...

  # Mobile build
  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd apps/mobile && npm ci

      - name: Build project
        run: |
          cd apps/mobile && npm run build

  # Code quality
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run linter
        run: |
          cd apps/backend && golangci-lint run
GITHUB_START