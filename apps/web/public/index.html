<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>Contigo - Acompañamiento</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      font-family: 'Lexend', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #F8FAFC;
    }
    [data-composition-id="contigo-simple"] {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }
    /* Scene 1: Logo + Tagline */
    #scene1 {
      background: linear-gradient(135deg, #00668A 0%, #0AA5E2 100%);
    }
    .logo {
      font-size: 120px;
      font-weight: 700;
      color: white;
      opacity: 0;
    }
    .tagline {
      font-size: 42px;
      font-weight: 300;
      color: white;
      margin-top: 30px;
      opacity: 0;
    }
    /* Scene 2: Value prop */
    #scene2 {
      background: white;
    }
    .icon-circle {
      width: 200px;
      height: 200px;
      background: #E0F2FE;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      margin-bottom: 40px;
      opacity: 0;
    }
    .value-title {
      font-size: 56px;
      font-weight: 600;
      color: #00668A;
      opacity: 0;
    }
    .value-desc {
      font-size: 32px;
      color: #0369A1;
      margin-top: 20px;
      opacity: 0;
    }
    /* Scene 3: CTA */
    #scene3 {
      background: linear-gradient(135deg, #87CEEB 0%, #38BDF8 100%);
    }
    .cta-text {
      font-size: 64px;
      font-weight: 700;
      color: #00668A;
      opacity: 0;
    }
    .cta-sub {
      font-size: 36px;
      color: #0C4A6E;
      margin-top: 30px;
      opacity: 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="contigo-simple" data-width="1920" data-height="1080" data-start="0">
    <!-- Scene 1: Logo + Tagline (0-5s) -->
    <div class="scene" id="scene1">
      <div class="logo">Contigo</div>
      <div class="tagline">Cuidado integral para tus seres queridos</div>
    </div>

    <!-- Scene 2: Value prop (5-10s) -->
    <div class="scene" id="scene2">
      <div class="icon-circle">🤝</div>
      <div class="value-title">Acompañamiento profesional</div>
      <div class="value-desc">Para adultos mayores y turistas de salud</div>
    </div>

    <!-- Scene 3: CTA (10-15s) -->
    <div class="scene" id="scene3">
      <div class="cta-text">Contigo</div>
      <div class="cta-sub">Siempre a tu lado</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1: 0-5s
    tl.to("#scene1", { opacity: 1, duration: 0.5 }, 0.3);
    tl.to(".logo", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5);
    tl.to(".tagline", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.0);
    tl.to("#scene1", { opacity: 0, duration: 0.5 }, 4.0);
    tl.set("#scene1", { visibility: "hidden" }, 4.5);

    // Scene 2: 5-10s
    tl.to("#scene2", { opacity: 1, duration: 0.5 }, 5.0);
    tl.to(".icon-circle", { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 5.3);
    tl.to(".value-title", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.0);
    tl.to(".value-desc", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.5);
    tl.to("#scene2", { opacity: 0, duration: 0.5 }, 9.0);
    tl.set("#scene2", { visibility: "hidden" }, 9.5);

    // Scene 3: 10-15s
    tl.to("#scene3", { opacity: 1, duration: 0.5 }, 10.0);
    tl.to(".cta-text", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 10.3);
    tl.to(".cta-sub", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 11.0);
    tl.to("#scene3", { opacity: 0, duration: 0.5 }, 14.0);
    tl.set("#scene3", { visibility: "hidden" }, 14.5);

    window.__timelines["contigo-simple"] = tl;
  </script>
</body>
</html>
